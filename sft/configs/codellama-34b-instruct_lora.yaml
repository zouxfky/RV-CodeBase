### model
model_name_or_path: /home/zouxiaofeng/models/CodeLlama-34b-Instruct-hf
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
deepspeed: /home/zouxiaofeng/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: sft/configs
dataset: rvcodebase_train
eval_dataset: rvcodebase_eval
template: llama2
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: sft/results/codellama-34b-instruct-lora
logging_steps: 20
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard

### train
# effective batch = per_device * grad_accum * num_gpus
# 8 GPUs * 1 sample/GPU * 2 accumulation steps = 16
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 8.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
