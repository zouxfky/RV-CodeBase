### model
model_name_or_path: codellama/CodeLlama-13b-Instruct-hf
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
dataset_dir: sft/configs
dataset: rvcodebase_train
eval_dataset: rvcodebase_eval
template: llama2
cutoff_len: 8192
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: sft/results/codellama-13b-instruct-lora
logging_steps: 20
save_steps: 500
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard

### train
# effective batch = per_device * grad_accum * num_gpus
# 4 GPUs * 1 sample/GPU * 4 accumulation steps = 16
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 8.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
