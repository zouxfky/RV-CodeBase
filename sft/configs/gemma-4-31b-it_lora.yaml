### model
model_name_or_path: google/gemma-4-31B-it
trust_remote_code: true
attn_implementation: sdpa

### FSDP1: rank 0 reads both weight shards, then parameters are sharded over 4 GPUs
fsdp: true
fsdp_config:
  version: 1
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap:
    - Gemma4TextDecoderLayer
  cpu_ram_efficient_loading: true
  activation_checkpointing: true
  reshard_after_forward: full_shard
  use_orig_params: true
  sync_module_states: true
  limit_all_gathers: true
  forward_prefetch: false
  backward_prefetch: BACKWARD_PRE
  state_dict_type: FULL_STATE_DICT

### LoRA: the script restricts these names to model.language_model.layers
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
train_file: sft/data/train.jsonl
eval_file: sft/data/eval.jsonl
cutoff_len: 3072
min_response_tokens: 1024

### output
output_dir: sft/results/gemma-4-31b-it-lora
resume_from_checkpoint: auto
report_to:
  - tensorboard

### train: effective batch = 1 * 4 accumulation * 4 GPUs = 16
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 8.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 75
weight_decay: 0.01
max_grad_norm: 1.0
tf32: true
seed: 42

### logging and checkpoints
logging_steps: 10
eval_steps: 250
save_steps: 250
save_total_limit: 3
dataloader_num_workers: 4
